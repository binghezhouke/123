[project]
name = "123"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "pybase62>=1.0.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv"]
line-length = 120

[tool.ruff.lint]
# 先只开"真问题"级别：未定义/未使用、语法错误。
# 想收紧（import 排序、类型注解风格等）时再加规则即可。
select = ["E4", "E7", "E9", "F"]
