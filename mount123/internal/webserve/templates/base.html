{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} · CloudArchive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v={{.Version}}">
    <link rel="stylesheet" href="/static/css/browser.css?v={{.Version}}">
    <link rel="stylesheet" href="/static/css/gallery.css?v={{.Version}}">
    <link rel="stylesheet" href="/static/css/browser_position.css?v={{.Version}}">
    <link rel="stylesheet" href="/static/css/polish.css?v={{.Version}}">
    <link rel="stylesheet" href="/static/css/finder.css?v={{.Version}}">
    <script>
        // Apply the persisted sidebar state before the first paint. The
        // regular end-of-body initializer still binds the toggle, but this
        // prevents a collapsed sidebar briefly flashing open on navigation.
        try { if (localStorage.getItem('sidebarCollapsed') === '1') document.documentElement.classList.add('sidebar-collapsed'); } catch (_) {}
    </script>
</head>
<body>
<div class="finder-window">
    <aside class="finder-sidebar">
        <a class="browser-brand" href="/browse?parent_id={{.RootID}}"><span class="brand-mark"><i class="fas fa-layer-group" aria-hidden="true"></i></span>CloudArchive</a>
        <div class="sidebar-section">
            <div class="sidebar-header">资料库</div>
            <a href="/browse?parent_id={{.RootID}}" class="sidebar-item active"><span class="sidebar-icon"><i class="fas fa-hdd" aria-hidden="true"></i></span><span>我的文件</span></a>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-header">收藏</div>
            <a href="/favorites" class="sidebar-item"><span class="sidebar-icon" aria-hidden="true">☆</span><span>所有收藏</span></a>
        </div>
        <div class="sidebar-footer"><span class="connection-dot"></span>123 云盘</div>
    </aside>

    <div class="finder-content">
        <div class="finder-toolbar">
            <div class="toolbar-left">
                <button type="button" class="toolbar-btn" id="sidebar-toggle" title="显示/隐藏侧边栏" aria-label="显示/隐藏侧边栏"><i class="fas fa-bars" aria-hidden="true"></i></button>
                <button type="button" class="toolbar-btn" onclick="history.back()" title="后退" aria-label="后退"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                <button type="button" class="toolbar-btn" onclick="history.forward()" title="前进" aria-label="前进"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
                <div class="toolbar-separator"></div>
                <span class="toolbar-location">{{.Title}}</span>
            </div>
            <div class="toolbar-right">
                <div class="view-toggle">
                    <button type="button" class="view-toggle-btn active" id="iconViewBtn" title="图标视图" aria-label="图标视图" onclick="switchView('icons')"><i class="fas fa-th-large"></i></button>
                    <button type="button" class="view-toggle-btn" id="listViewBtn" title="列表视图" aria-label="列表视图" onclick="switchView('list')"><i class="fas fa-list"></i></button>
                </div>
                <div class="toolbar-separator"></div>
                <a class="toolbar-btn" href="/favorites" title="收藏" aria-label="打开收藏">☆</a>
                <button type="button" class="toolbar-btn" onclick="refreshFiles()" title="刷新" aria-label="刷新文件"><i class="fas fa-sync-alt"></i></button>
                {{if .Authenticated}}
                <div class="toolbar-separator"></div>
                <form class="logout" method="post" action="/logout"><button type="button" class="toolbar-btn" onclick="this.closest('form').submit()" title="退出登录">退出</button></form>
                {{end}}
            </div>
        </div>

        {{if .Error}}<div class="alert alert-danger alert-dismissible fade show" role="alert">{{.Error}}</div>{{end}}

        <main class="finder-main page-content">
            {{template "content" .}}
        </main>

        <div class="status-bar">
            <span id="statusText">就绪</span>
            <span id="statusCount"></span>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<dialog id="favorite-picker" aria-labelledby="favorite-picker-title">
    <form method="dialog"><button class="favorite-close" aria-label="关闭">×</button></form>
    <p class="eyebrow">收藏标记</p><h2 id="favorite-picker-title"></h2>
    <div id="favorite-colors" aria-label="选择收藏颜色"></div>
    <button type="button" id="favorite-remove" class="btn btn-secondary">取消收藏</button>
    <p id="favorite-message" role="status" aria-live="polite"></p>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js?v={{.Version}}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    // Keep breadcrumbs in the Finder toolbar so directory content gets the
    // full vertical viewport. Detail and browse pages share this navigation.
    const toolbarLeft = document.querySelector('.finder-toolbar .toolbar-left');
    const location = toolbarLeft?.querySelector('.toolbar-location');
    document.querySelectorAll('.browser-path').forEach(function (path) {
        if (!toolbarLeft || path.closest('.finder-toolbar')) return;
        path.classList.add('toolbar-breadcrumbs');
        toolbarLeft.insertBefore(path, location || null);
    });
    const directoryHeading = document.querySelector('.directory-heading');
    const directoryTitle = directoryHeading?.querySelector(':scope > div:first-child');
    const directoryCount = directoryHeading?.querySelector('[data-file-count]');
    const probeStatus = directoryHeading?.querySelector('#probe-archive-status');
    const statusCount = document.getElementById('statusCount');
    const toolbarRight = document.querySelector('.finder-toolbar .toolbar-right');
    if (directoryTitle && toolbarLeft) {
        directoryTitle.classList.add('toolbar-directory-title');
        toolbarLeft.append(directoryTitle);
    }
    if (directoryCount && statusCount) {
        statusCount.replaceWith(directoryCount);
    }
    if (probeStatus && toolbarRight) toolbarRight.prepend(probeStatus);
    if (directoryHeading) directoryHeading.remove();
    const savedView = localStorage.getItem('finderViewMode');
    if (savedView && typeof switchView === 'function') switchView(savedView);
    updateStatusBar();
});
(() => {
    const toggle = document.getElementById('sidebar-toggle');
    const sidebar = document.querySelector('.finder-sidebar');
    if (!toggle || !sidebar) return;
    const setCollapsed = collapsed => {
        sidebar.classList.toggle('collapsed', collapsed);
        document.documentElement.classList.toggle('sidebar-collapsed', collapsed);
    };
    setCollapsed(localStorage.getItem('sidebarCollapsed') === '1');
    toggle.addEventListener('click', () => {
        const collapsed = !sidebar.classList.contains('collapsed');
        setCollapsed(collapsed);
        localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0');
    });
})();
function updateStatusBar() {
    const items = document.querySelectorAll('.file-item');
    const count = items.length;
    const statusCount = document.getElementById('statusCount');
    const statusText = document.getElementById('statusText');
    if (count > 0 && statusCount) statusCount.textContent = count + ' 个项目';
    items.forEach(function (item) {
        item.addEventListener('mouseenter', function () {
            const name = item.querySelector('h6')?.textContent?.trim() || '项目';
            if (statusText) statusText.textContent = name;
        });
        item.addEventListener('mouseleave', function () { if (statusText) statusText.textContent = '就绪'; });
    });
}
function refreshFiles() {
    const btn = document.querySelector('.toolbar-btn[onclick="refreshFiles()"] i');
    if (btn) { btn.classList.add('fa-spin'); setTimeout(() => btn.classList.remove('fa-spin'), 500); }
    const url = new URL(window.location.href);
    url.searchParams.set('refresh', '1');
    window.location.href = url.toString();
}
</script>
<script src="/static/js/favorites.js?v={{.Version}}" defer></script>
<script src="/static/js/column_resize.js?v={{.Version}}" defer></script>
<script src="/static/js/partial_navigation.js?v={{.Version}}" defer></script>
</body>
</html>{{end}}
